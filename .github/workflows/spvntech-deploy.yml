name: Deploy to SPVN Tech VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        env:
          BASE_PATH: /pdf-tools
          NODE_ENV: production
        run: npm run build

      - name: Verify build output
        run: |
          if [ ! -d "out/_next" ]; then
            echo "Error: out/_next directory not found!"
            exit 1
          fi
          if [ ! -f "out/index.html" ]; then
            echo "Error: out/index.html not found!"
            exit 1
          fi
          if [ -z "$(ls -A out)" ]; then
            echo "Error: out directory is empty!"
            exit 1
          fi
          echo "Build verification passed."

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Ensure remote directory exists
        run: |
          ssh -i ~/.ssh/deploy_key -o ServerAliveInterval=30 -o ServerAliveCountMax=10 ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "mkdir -p /home/spvntech/web/spvntech.in/public_html/pdf-tools"

      - name: Deploy to VPS using rsync
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key -o ServerAliveInterval=30 -o ServerAliveCountMax=10" ./out/ ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/home/spvntech/web/spvntech.in/public_html/pdf-tools/

      - name: Verify deployment remotely
        run: |
          ssh -i ~/.ssh/deploy_key -o ServerAliveInterval=30 -o ServerAliveCountMax=10 ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "test -f /home/spvntech/web/spvntech.in/public_html/pdf-tools/index.html || (echo 'Verification failed: remote index.html not found' && exit 1)"
          echo "Deployment verified successfully."
