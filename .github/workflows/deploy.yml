name: Deploy PDFCraft

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pdfcraft-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build and Deploy PDFCraft
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Restore Next.js cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Install dependencies
        run: npm ci

      - name: Build PDFCraft
        env:
          NODE_ENV: production
          BASE_PATH: /pdf-tools
        run: npm run build

      - name: Verify build output
        run: |
          test -f ./out/index.html
          test -d ./out/_next
          echo "PDFCraft build verified successfully"
          du -sh ./out

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          mkdir -p ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Ensure deployment directory exists
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            "$SERVER_USER@$SERVER_HOST" \
            "mkdir -p /home/spvntech/web/spvntech.in/public_html/pdf-tools"

      - name: Deploy PDFCraft
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_ed25519 -o ServerAliveInterval=30 -o ServerAliveCountMax=10" \
            ./out/ \
            "$SERVER_USER@$SERVER_HOST:/home/spvntech/web/spvntech.in/public_html/pdf-tools/"

      - name: Verify deployment
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            "$SERVER_USER@$SERVER_HOST" \
            "test -f /home/spvntech/web/spvntech.in/public_html/pdf-tools/index.html && echo 'Deployment verified successfully'"